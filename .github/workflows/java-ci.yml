name: Java and Docker verification
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build container and run Java tests
        run: docker build -t careerforge:ci .
      - name: Check public-profile startup
        run: |
          docker run -d --name careerforge -p 8090:8090 careerforge:ci
          trap 'docker logs careerforge; docker stop careerforge' EXIT
          curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-all-errors --retry-max-time 180 --connect-timeout 3 --max-time 5 http://localhost:8090/api/auth/config > /tmp/config.json
          node -e 'const c=require("/tmp/config.json"); if(c.demoEnabled !== false) process.exit(1);'
