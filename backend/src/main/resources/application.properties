server.port=${PORT:8090}
spring.datasource.url=jdbc:h2:file:./data/careerforge;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.placeholders.largeTextType=CLOB
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
careerforge.seed-demo=${SEED_DEMO:true}
careerforge.auth.login-limit=${AUTH_LOGIN_LIMIT:20}
careerforge.auth.registration-limit=${AUTH_REGISTRATION_LIMIT:10}
careerforge.auth.login-window-ms=${AUTH_LOGIN_WINDOW_MS:900000}
careerforge.auth.registration-window-ms=${AUTH_REGISTRATION_WINDOW_MS:3600000}
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false
careerforge.ai.api-key=${OPENAI_API_KEY:}
careerforge.ai.model=${OPENAI_MODEL:gpt-4.1-mini}
careerforge.ai.url=https://api.openai.com/v1/responses
careerforge.ai.daily-limit=20
careerforge.mail.mode=${MAIL_MODE:smtp}
careerforge.mail.from=${MAIL_FROM:careerforge@localhost}
careerforge.mail.directory=./data/mail
careerforge.base-url=${APP_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8090}}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
